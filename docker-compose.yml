services:
  crawler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
      args:
        - HTTP_PROXY=${BUILD_HTTP_PROXY:-}
        - HTTPS_PROXY=${BUILD_HTTPS_PROXY:-}
    container_name: ai-art-crawler
    networks:
      - aicreatorvault_aicreatorvault-net
    volumes:
      - ./data:/data
    environment:
      - OUTPUT_DIR=/data/crawled
      - DATABASE_URL=postgresql://${DB_USER:-aicreator}:${DB_PASSWORD:?DB_PASSWORD is required}@aicreatorvault-postgres-1:5432/${DB_NAME:-aicreatorvault}
      - HTTP_PROXY=http://aigc-xray:1087
      - HTTPS_PROXY=http://aigc-xray:1087
    command: python scripts/run_crawler.py --site civitai --limit 20 --tag portrait --download --save-db
    profiles:
      - crawl

  exporter:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
      args:
        - HTTP_PROXY=${BUILD_HTTP_PROXY:-}
        - HTTPS_PROXY=${BUILD_HTTPS_PROXY:-}
    container_name: ai-art-exporter
    networks:
      - aicreatorvault_aicreatorvault-net
    volumes:
      - ./data:/data
    environment:
      - HTTP_PROXY=http://aigc-xray:1087
      - HTTPS_PROXY=http://aigc-xray:1087
      - AICV_URL=${AICV_URL:-http://aicreatorvault-backend-1:3001}
    # command 在 docker compose run 时会被覆盖，这里是默认值
    command: >
      sh -c "python scripts/export_to_aicv.py /data/crawled/civitai_*.json --url $${AICV_URL}"
    profiles:
      - export

networks:
  aicreatorvault_aicreatorvault-net:
    external: true
